<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">🔐 Iniciar Sesión</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/usuarios/login}" method="post">
                            <!-- Mensajes de error -->
                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                                <span th:text="${error}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                            
                            <!-- Mensajes de éxito (ej: registro exitoso) -->
                            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
                                <span th:text="${exito}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       placeholder="usuario@ejemplo.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="clave" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="clave" name="clave" required>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Iniciar Sesión</button>
                                <a th:href="@{/}" class="btn btn-outline-secondary">Volver al Inicio</a>
                            </div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="mb-2">¿No tienes una cuenta?</p>
                            <a th:href="@{/usuarios/registro}" class="btn btn-outline-success">Registrarse como Cliente</a>
                        </div>
                    </div>
                </div>
                
                <!-- Credenciales de prueba (solo en desarrollo) -->
                <div class="card mt-3">
                    <div class="card-body">
                        <h6 class="card-title">Credenciales de prueba:</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <p class="mb-1"><strong>Admin:</strong> admin@consultoria.com / admin123</p>
                                <p class="mb-1"><strong>Cliente:</strong> cliente@ejemplo.com / cliente123</p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Soporte:</strong> soporte@consultoria.com / soporte123</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
