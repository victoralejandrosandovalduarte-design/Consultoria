<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">📝 Registro de Nuevo Cliente</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/usuarios/registro}" th:object="${usuario}" method="post">
                            <!-- Datos del Usuario -->
                            <h5 class="mb-3">Datos de Acceso</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Correo Electrónico *</label>
                                    <input type="email" th:field="*{email}" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contraseña *</label>
                                    <input type="password" th:field="*{clave}" class="form-control" required>
                                </div>
                            </div>
                            
                            <!-- Datos del Cliente -->
                            <h5 class="mb-3 mt-4">Datos Personales y Empresa</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre *</label>
                                    <input type="text" th:field="*{cliente.nombre}" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellido *</label>
                                    <input type="text" th:field="*{cliente.apellido}" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Empresa *</label>
                                    <input type="text" th:field="*{cliente.empresa}" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">CI/RUC *</label>
                                    <input type="text" th:field="*{cliente.ciRuc}" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ciudad *</label>
                                    <input type="text" th:field="*{cliente.ciudad}" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Lugar de Mantenimiento</label>
                                    <input type="text" th:field="*{cliente.lugarMantenimiento}" class="form-control">
                                </div>
                            </div>
                            
                            <input type="hidden" th:field="*{rol}" value="CLIENTE">
                            <input type="hidden" th:field="*{estado}" value="true">
                            
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg">Registrarse</button>
                                <a th:href="@{/usuarios/login}" class="btn btn-outline-primary">Ya tengo cuenta</a>
                                <a th:href="@{/}" class="btn btn-outline-secondary">Volver al Inicio</a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="mt-3 text-center text-muted">
                    <small>Los usuarios ADMIN y SOPORTE solo pueden ser creados por administradores del sistema.</small>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
