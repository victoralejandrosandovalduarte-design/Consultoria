<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}">
    <title>Panel de Administrador</title>
</head>
<body>
    <nav th:replace="~{fragments :: menu}"></nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">👑 Panel de Administración</h4>
                    </div>
                    <div class="card-body">
                        <h5>Bienvenido, <span th:text="${usuario.email}"></span></h5>
                        <p>Desde aquí puedes gestionar todos los aspectos del sistema.</p>
                        
                        <div class="row mt-4">
                            <div class="col-md-3 mb-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5>👥 Usuarios</h5>
                                        <a th:href="@{/admin/usuarios}" class="btn btn-primary mt-2">Gestionar</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5>🔧 Servicios</h5>
                                        <a th:href="@{/servicios}" class="btn btn-success mt-2">Ver Todos</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5>🏢 Clientes</h5>
                                        <a th:href="@{/admin/clientes}" class="btn btn-info mt-2">Gestionar</a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h5>📊 Reportes</h5>
                                        <a th:href="@{/admin/reportes}" class="btn btn-warning mt-2">Generar</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
