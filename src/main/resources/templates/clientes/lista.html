<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}">
    <title>Clientes</title>
</head>
<body>
    <nav th:replace="~{fragments :: menu}"></nav>
    
    <div class="container mt-4">
        <div th:replace="~{fragments :: mensajes}"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Clientes</h1>
            <a th:href="@{/clientes/nuevo}" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Nuevo Cliente
            </a>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Empresa</th>
                                <th>CI/RUC</th>
                                <th>Ciudad</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.idCliente}"></td>
                                <td th:text="${cliente.nombre + ' ' + cliente.apellido}"></td>
                                <td th:text="${cliente.empresa}"></td>
                                <td th:text="${cliente.ciRuc}"></td>
                                <td th:text="${cliente.ciudad}"></td>
                                <td>
                                    <a th:href="@{/clientes/{id}(id=${cliente.idCliente})}" 
                                       class="btn btn-sm btn-info">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/clientes/{id}/editar(id=${cliente.idCliente})}" 
                                       class="btn btn-sm btn-warning">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" 
                                            class="btn btn-sm btn-danger"
                                            data-bs-toggle="modal" 
                                            data-bs-target="#modalEliminar"
                                            th:data-id="${cliente.idCliente}"
                                            th:data-nombre="${cliente.nombre}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal de confirmación -->
    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro de eliminar al cliente <span id="nombreCliente"></span>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formEliminar" method="post">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('modalEliminar');
            modal.addEventListener('show.bs.modal', function(event) {
                const button = event.relatedTarget;
                const id = button.getAttribute('data-id');
                const nombre = button.getAttribute('data-nombre');
                
                document.getElementById('nombreCliente').textContent = nombre;
                document.getElementById('formEliminar').action = '/clientes/' + id + '/eliminar';
            });
        });
    </script>
</body>
</html>
