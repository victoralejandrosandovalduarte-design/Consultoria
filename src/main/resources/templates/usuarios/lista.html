<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuarios - Consultoría TI</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --primary-light: #4cc9f0;
            --secondary: #adb5bd;
            --success: #06d6a0;
            --info: #118ab2;
            --warning: #ffd166;
            --danger: #ef476f;
            --light: #f8f9fa;
            --dark: #073b4c;
        }
        
        body {
            background: var(--light);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
        }
        
        .sidebar {
            background: var(--primary-dark);
            color: white;
            height: 100vh;
            padding: 1rem;
            position: fixed;
            width: 250px;
        }
        
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            margin: 0.5rem 0;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }
        
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }
        
        .header {
            background: white;
            border-bottom: 1px solid var(--secondary);
            padding: 1rem 2rem;
        }
        
        .user-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
        
        .stats-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
            text-align: center;
        }
        
        .stats-icon {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
        }
        
        .bg-primary-light { background: var(--primary-light); color: var(--primary-dark); }
        .bg-success-light { background: rgba(6,214,160,0.1); color: var(--success); }
        .bg-warning-light { background: rgba(255,209,102,0.1); color: var(--warning); }
        .bg-info-light { background: rgba(17,138,178,0.1); color: var(--info); }
        .bg-danger-light { background: rgba(239,71,111,0.1); color: var(--danger); }
        
        .recent-activity {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
        
        .activity-item {
            display: flex;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--light);
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .activity-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-right: 1rem;
        }
        
        .quick-actions .btn {
            padding: 0.75rem;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                position: static;
                height: auto;
                width: 100%;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>

</head>
<body>
    <!-- Sidebar como en principal -->
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="text-center mb-4">
                <h3 class="h4 mb-0">TI Consult</h3>
                <small class="text-muted">Sistema de Gestión</small>
            </div>
            
            <ul class="nav flex-column">
                <li><a th:href="@{/principal}" class="nav-link active"><i class="bi bi-house-door me-2"></i> Inicio</a></li>
                <li><a th:href="@{/servicios}" class="nav-link"><i class="bi bi-tools me-2"></i> Servicios</a></li>
                
                <li th:if="${session.usuario.rol == 'ADMIN'}">
                    <a th:href="@{/usuarios}" class="nav-link"><i class="bi bi-people me-2"></i> Usuarios</a>
                </li>
                
                <li th:if="${session.usuario.rol == 'ADMIN' or session.usuario.rol == 'SOPORTE'}">
                    <a th:href="@{/clientes}" class="nav-link"><i class="bi bi-person-badge me-2"></i> Clientes</a>
                </li>
                
                <li><a th:href="@{/perfil}" class="nav-link"><i class="bi bi-person-circle me-2"></i> Perfil</a></li>
                <li><a th:href="@{/usuarios/logout}" class="nav-link"><i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</a></li>
            </ul>
        </nav>
        
    <div class="main-content flex-grow-1">
        <header class="header d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 mb-0">Panel Principal</h2>
                
                <div class="d-flex align-items-center">
                    <div class="me-3 text-end">
                        <small id="currentTime" class="text-muted"></small>
                    </div>
                    
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2"></i>
                            <span th:text="${session.usuario.email}"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/perfil}"><i class="bi bi-person me-2"></i> Perfil</a></li>
                            <li><a class="dropdown-item" th:href="@{/configuracion}"><i class="bi bi-gear me-2"></i> Configuración</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/usuarios/logout}"><i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </header>
        <div class="container-fluid">
            
       <h2 class="mb-4">Usuarios (Total: <span th:text="${usuarios.size()}"></span>)</h2>
        <div class="row">
                    <div th:each="usuario : ${usuarios}" class="col-md-4 mb-4">
                        <div class="service-card">
                            <h5 th:text="${usuario.email}"></h5>
                            <p><strong>Rol:</strong> <span th:text="${usuario.rol}"></span></p>
                            <p><strong>Estado:</strong> <span th:text="${usuario.estado ? 'Activo' : 'Inactivo'}"></span></p>
                            <a th:href="@{/usuarios/${usuario.idUsuario}/editar}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:action="@{/usuarios/${usuario.idUsuario}/eliminar}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </div>
                    </div>
        </div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary mb-4">Nuevo Usuario</a>
        </div>
    </div>
    </div>
       
       <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.idUsuario}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.rol}"></td>
                    <td th:text="${usuario.estado ? 'Activo' : 'Inactivo'}"></td>
                    <td>
                        <a th:href="@{/usuarios/${usuario.idUsuario}/editar}" class="btn btn-sm btn-primary">Editar</a>
                        <form th:action="@{/usuarios/${usuario.idUsuario}/eliminar}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo Usuario</a>
    </div>
</body>
</html>
