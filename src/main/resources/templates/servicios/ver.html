<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ver Servicio</title>
    <!-- Bootstrap y estilos -->
</head>
<body>
    <!-- Sidebar -->
    
    <div class="main-content">
        <h2>Servicio #<span th:text="${servicio.numeroOrden}"></span></h2>
        
        <!-- Detalles del servicio -->
        <div class="user-card mb-4">
            <p><strong>Cliente:</strong> <span th:text="${servicio.cliente.nombre} + ' ' + ${servicio.cliente.apellido}"></span></p>
            <p><strong>Estado:</strong> <span th:text="${servicio.estado}"></span></p>
            <!-- Otros detalles -->
        </div>
        
        <!-- Comentarios -->
        <div class="recent-activity">
            <h4>Comentarios</h4>
            <div th:each="comentario : ${servicio.comentarios}">
                <div class="activity-item">
                    <div>
                        <strong th:text="${comentario.usuario.email}"></strong>
                        <p th:text="${comentario.texto}"></p>
                        <small th:text="${#temporals.format(comentario.fecha, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                </div>
            </div>
            
            <!-- Form para agregar comentario (solo soporte/admin) -->
            <th:if th:if="${usuario.rol == 'SOPORTE' or usuario.rol == 'ADMIN'}">
                <form th:action="@{/servicios/${servicio.idServicio}/estado}" method="post">
                    <input type="hidden" name="estado" th:value="${servicio.estado}" />
                    <textarea name="comentario" placeholder="Agregar comentario"></textarea>
                    <button type="submit" class="btn btn-primary">Agregar</button>
                </form>
            </th:if>
        </div>
    </div>
</body>
</html>
