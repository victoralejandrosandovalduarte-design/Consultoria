<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultoría TI - Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Contenido simplificado para testing -->
    <div class="container mt-5 text-center">
        <h1>🔧 Sistema de Consultoría TI</h1>
        <p class="lead">Sistema de gestión de servicios técnicos</p>
        
        <div class="mt-4">
            <a th:href="@{/usuarios/login}" class="btn btn-primary btn-lg me-2">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </a>
            <a th:href="@{/usuarios/registro}" class="btn btn-outline-primary btn-lg">
                <i class="bi bi-person-plus"></i> Registrarse
            </a>
        </div>
        
        <div class="mt-5">
            <h3>Usuarios de prueba:</h3>
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5>Administrador</h5>
                            <p>admin@consultoria.com</p>
                            <p><strong>Contraseña:</strong> admin123</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5>Cliente</h5>
                            <p>cliente@ejemplo.com</p>
                            <p><strong>Contraseña:</strong> cliente123</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5>Soporte</h5>
                            <p>soporte@consultoria.com</p>
                            <p><strong>Contraseña:</strong> soporte123</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
