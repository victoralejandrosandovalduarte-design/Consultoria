<!-- Agregar al fragmento de mensajes -->
<div th:fragment="breadcrumb">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/principal}">Inicio</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${titulo}"></li>
        </ol>
    </nav>
</div>

<!-- Agregar al fragmento de scripts -->
<script th:fragment="datatables">
    $(document).ready(function() {
        $('.table').DataTable({
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            },
            pageLength: 10,
            responsive: true
        });
    });
</script>
