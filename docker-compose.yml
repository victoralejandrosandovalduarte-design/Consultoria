version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: consultoria_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soporte_db
      MYSQL_USER: Admin
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: consultoria_app
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/soporte_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: Admin
      SPRING_DATASOURCE_PASSWORD: 1234
      # First-run admin credentials — override these before deploying!
      ADMIN_EMAIL: admin@consultoria.com
      ADMIN_PASSWORD: admin123
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
